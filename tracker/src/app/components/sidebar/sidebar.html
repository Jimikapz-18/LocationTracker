<nav class="sidebar" [class.open]="open">

  <!-- Logo + close -->
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="10" r="3" stroke="#22d3ee" stroke-width="2"/>
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"
              stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" fill="rgba(34,211,238,0.08)"/>
      </svg>
      <span>PulseTrack</span>
    </div>
    <button class="close-btn" (click)="close()" aria-label="Close menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- User card -->
  @if (currentUser()) {
    <div class="user-card">
      <div class="user-avatar">{{ getInitials(currentUser()!.name) }}</div>
      <div class="user-info">
        <div class="user-name">{{ currentUser()!.name }}</div>
        <div class="user-status">
          <span class="status-dot"></span>Online
        </div>
      </div>
    </div>
  }

  <!-- Navigation -->
  <nav class="nav-list">

    <a class="nav-item" routerLink="/home/map" routerLinkActive="active" (click)="close()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3,6 9,3 15,6 21,3 21,18 15,21 9,18 3,21"/>
        <line x1="9" y1="3" x2="9" y2="18"/>
        <line x1="15" y1="6" x2="15" y2="21"/>
      </svg>
      <span>Live Map</span>
    </a>

    <a class="nav-item" routerLink="/home/friends" routerLinkActive="active" (click)="close()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Find Friends</span>
    </a>

    <a class="nav-item" routerLink="/home/requests" routerLinkActive="active" (click)="close()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
        <line x1="6" y1="1" x2="6" y2="4"/>
        <line x1="10" y1="1" x2="10" y2="4"/>
        <line x1="14" y1="1" x2="14" y2="4"/>
      </svg>
      <span>Requests</span>
      @if (pendingRequestCount() > 0) {
        <span class="nav-badge">{{ pendingRequestCount() }}</span>
      }
    </a>

  </nav>

  <!-- Footer / logout -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16,17 21,12 16,7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Logout</span>
    </button>
  </div>

</nav>
